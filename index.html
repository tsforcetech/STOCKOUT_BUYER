<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Plain http (e.g. a link opened from Instagram) is not a secure context: sign-in tokens would travel unencrypted
      // and browser crypto APIs are missing. Move to https before the app starts (localhost excluded for development).
      if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Buy and sell verified surplus stock in the UAE: pipes, cables, steel, cement, tiles and more from verified sellers in Dubai, Abu Dhabi and Sharjah. Unused excess inventory at below-market prices." />
    <title>StockOut – Surplus Stock Marketplace in UAE</title>
    <meta property="og:site_name" content="StockOut" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockOut – Surplus Stock Marketplace in UAE" />
    <meta property="og:description" content="Verified surplus stock and unused construction & industrial materials from UAE sellers, at below-market prices." />
    <meta property="og:url" content="https://www.stockoutme.com/" />
    <meta property="og:image" content="https://www.stockoutme.com/og-image.jpg" />
    <meta property="og:locale" content="en_AE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!-- Startup splash (brand icon), replaced as soon as the app renders. -->
      <style>
        .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f7f7; }
        .boot img { width: 48px; height: 48px; animation: boot-turn 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        @keyframes boot-turn { 0%, 12% { transform: rotate(0); } 25%, 37% { transform: rotate(90deg); } 50%, 62% { transform: rotate(180deg); } 75%, 87% { transform: rotate(270deg); } 100% { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
      </style>
      <div class="boot" role="status" aria-label="Loading"><img src="/favicon.svg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
