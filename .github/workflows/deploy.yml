
name: Build and Deploy Stockout Buyer DEV

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stockout-dev-deployment
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and Deploy to Windows Server
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      # 1. Download the latest repository source
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      # 2. Verify Node.js and npm
      - name: Check Node.js and npm
        run: |
          Write-Host "Checking Node.js and npm versions..."

          node --version
          npm --version

          if (!(Test-Path "package.json")) {
            throw "package.json not found in the repository root."
          }

          if (!(Test-Path "package-lock.json")) {
            throw "package-lock.json not found in the repository root."
          }

      # 3. Install exact dependencies from package-lock.json
      - name: Install Dependencies
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed."
          }

      # 4. TypeScript validation
      - name: Type Check
        run: |
          npm run typecheck

          if ($LASTEXITCODE -ne 0) {
            throw "Type checking failed."
          }

      # 5. ESLint validation
      - name: Lint
        run: |
          npm run lint

          if ($LASTEXITCODE -ne 0) {
            throw "Linting failed."
          }

      # 6. Run unit and integration tests (temporarily skipped)
      - name: Run Tests
        run: |
          Write-Host "Tests temporarily skipped. Continuing to production build."

      # 7. Build the production frontend
      - name: Build Production Website
        env:
          VITE_API_BASE_URL: https://stockout.flowb.io
        run: |
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "Production build failed."
          }

          $buildIndex = Join-Path $env:GITHUB_WORKSPACE "dist\index.html"

          if (!(Test-Path $buildIndex)) {
            throw "Build verification failed: dist\index.html not found."
          }

          Write-Host "Production build generated successfully."
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist") -Force |
            Select-Object Mode, Name, Length |
            Format-Table -AutoSize

      # 8. Deploy the built files to the Windows server directory
      - name: Deploy to STOCKOUT_DEV
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "dist"
          $target = "C:\SHARACO\STOCKOUT\STOCKOUT_DEV"

          Write-Host "Source: $source"
          Write-Host "Destination: $target"

          if (!(Test-Path $source)) {
            throw "Build output directory does not exist: $source"
          }

          if (!(Test-Path (Join-Path $source "index.html"))) {
            throw "The build output does not contain index.html."
          }

          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force |
              Out-Null
          }

          # Verify the runner can write to the deployment directory.
          $permissionTest = Join-Path $target ".deployment-write-test"

          try {
            Set-Content -Path $permissionTest -Value "write test" -ErrorAction Stop
            Remove-Item $permissionTest -Force -ErrorAction Stop
          }
          catch {
            throw "The runner cannot write to $target. Grant Modify permission to NT AUTHORITY\NETWORK SERVICE. Details: $($_.Exception.Message)"
          }

          # Copy production output only; do not copy source files or node_modules.
          # /E copies subdirectories, including empty ones.
          # /R and /W limit retries.
          # /XF web.config prevents overwriting an existing server configuration.
          & robocopy $source $target /E /R:2 /W:2 /XF web.config

          $robocopyExitCode = $LASTEXITCODE

          # Robocopy exit codes 0-7 indicate success or non-fatal differences.
          if ($robocopyExitCode -ge 8) {
            throw "Robocopy failed with exit code $robocopyExitCode."
          }

          # Verify that the deployed site contains index.html.
          $deployedIndex = Join-Path $target "index.html"

          if (!(Test-Path $deployedIndex)) {
            throw "Deployment verification failed: $deployedIndex not found."
          }

          $deployedFiles = @(
            Get-ChildItem $target -Recurse -File -Force
          )

          if ($deployedFiles.Count -eq 0) {
            throw "Deployment verification failed: destination contains no files."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "============================================"
          Write-Host "Destination: $target"
          Write-Host "Files deployed/present: $($deployedFiles.Count)"
          Write-Host ""
          Get-ChildItem $target -Force |
          Select-Object Mode, Name, Length |
          Format-Table -AutoSize

          # Explicitly return success after all deployment checks pass
          $global:LASTEXITCODE = 0
          exit 0

      # 9. Final deployment summary
      - name: Deployment Summary
        if: success()
        shell: powershell
        run: |
          Write-Host "Stockout Buyer DEV deployment completed successfully."
          Write-Host "Path: C:\SHARACO\STOCKOUT\STOCKOUT_DEV"
          exit 0

      - name: Report Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "Stockout Buyer DEV deployment failed."
          Write-Host "Review the first failed step above."
          exit 0
      
