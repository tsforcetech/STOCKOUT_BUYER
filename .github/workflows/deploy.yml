
name: Inspect Stockout Repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Inspect project files
        shell: powershell
        run: |
          Write-Host "===== ROOT FILES ====="
          Get-ChildItem -Force |
            Select-Object Mode, Name, Length |
            Format-Table -AutoSize

          Write-Host "===== PROJECT CONFIGURATION FILES ====="
          Get-ChildItem -Recurse -File -Force |
            Where-Object {
              $_.FullName -notmatch '\\(\.git|node_modules|dist|build|\.next)\\' -and
              $_.Name -match '^(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|vite\.config\..*|next\.config\..*|angular\.json|webpack\.config\..*|tsconfig\.json|README.*|.*\.csproj|.*\.sln)$'
            } |
            Select-Object -First 100 FullName |
            Format-Table -AutoSize

          Write-Host "===== ROOT README CONTENT ====="
          $readme = Get-ChildItem -File -Force |
            Where-Object { $_.Name -match '^README' } |
            Select-Object -First 1

          if ($readme) {
            Get-Content $readme.FullName -TotalCount 150
          } else {
            Write-Host "No root README found."
          }
