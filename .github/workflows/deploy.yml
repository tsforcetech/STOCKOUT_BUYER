
name: Deploy Stockout Source to Windows Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockout-dev-deployment
  cancel-in-progress: false

jobs:
  deploy-source:
    name: Copy source to STOCKOUT_DEV
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: source
          clean: true
          persist-credentials: false

      - name: Validate source
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "source"

          if (!(Test-Path $source)) {
            throw "Source directory not found: $source"
          }

          if (!(Test-Path (Join-Path $source "package.json"))) {
            Write-Host "Warning: package.json was not found at the repository root."
          }

          Write-Host "Source directory: $source"
          Get-ChildItem $source -Force |
            Select-Object Mode, Name, Length |
            Format-Table -AutoSize

      - name: Copy source to deployment folder
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "source"
          $target = "C:\SHARACO\STOCKOUT\STOCKOUT_DEV"

          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force |
              Out-Null
          }

          # Copy source files without copying Git metadata.
          # Existing destination files are retained unless overwritten.
          & robocopy $source $target /E /R:2 /W:2 /XD "$source\.git"

          $code = $LASTEXITCODE

          # Robocopy exit codes below 8 indicate success or non-fatal differences.
          if ($code -ge 8) {
            throw "Robocopy failed with exit code $code"
          }

          Write-Host "Robocopy completed with exit code $code"
          Write-Host "Deployment directory: $target"

      - name: Verify copied files
        shell: powershell
        run: |
          $target = "C:\SHARACO\STOCKOUT\STOCKOUT_DEV"

          if (!(Test-Path $target)) {
            throw "Deployment directory does not exist: $target"
          }

          $files = Get-ChildItem $target -Force

          if ($files.Count -eq 0) {
            throw "Deployment directory is empty."
          }

          Write-Host "Files and folders copied:"
          $files | Select-Object Mode, Name, Length |
            Format-Table -AutoSize

          Write-Host "Source copy verification completed."
